searches:
  # =============================================================
  # SOURCE CONNECTOR A
  # =============================================================
  - id: src-a-display-65
    site: cashconverters
    label: "Source A - Displays 65\" / OLED"
    path: "/Search?SearchQuery=LG+65"
    enabled: true
    rules:
      - id: rule-a-critical-g6
        label: "Ref G6 3D OLED"
        priority: critical
        includeKeywords: ["lg", "g6"]
        excludeKeywords: ["phone", "smartphone", "thinq"]
      - id: rule-a-critical-e6
        label: "Ref E6 3D OLED"
        priority: critical
        includeKeywords: ["lg", "e6"]
        excludeKeywords: ["phone", "smartphone"]
      - id: rule-a-critical-c6
        label: "Ref C6 3D OLED"
        priority: critical
        includeKeywords: ["lg", "c6"]
        excludeKeywords: ["phone", "smartphone"]
      - id: rule-a-critical-3d
        label: "Ref 3D Display Panel"
        priority: critical
        includeKeywords: ["lg", "3d"]
        excludeKeywords: ["glasses only", "phone", "monitor"]
      - id: rule-a-high-ef950
        label: "Ref EF950 3D OLED"
        priority: high
        includeKeywords: ["lg", "ef950"]
      - id: rule-a-high-oled
        label: "Ref 65\" OLED Panel"
        priority: high
        includeKeywords: ["lg", "oled", "65"]
      - id: rule-a-normal-65
        label: "Ref 65\" Display Generic"
        priority: normal
        includeKeywords: ["lg", "65"]
        excludeKeywords: ["remote only", "stand only", "bracket"]

  - id: src-a-power-tools
    site: cashconverters
    label: "Source A - Cordless Power Equipment"
    path: "/Search?SearchQuery=EGO"
    enabled: true
    rules:
      - id: rule-a-high-multitool
        label: "Multi-Tool Modular Head"
        priority: high
        includeKeywords: ["ego", "multi"]
        excludeKeywords: ["lego"]
      - id: rule-a-high-blower
        label: "High-CFM Blower"
        priority: high
        includeKeywords: ["ego", "blower"]
        excludeKeywords: ["lego"]
      - id: rule-a-high-chainsaw
        label: "Chainsaw Equipment"
        priority: high
        includeKeywords: ["ego", "chainsaw"]
        excludeKeywords: ["lego"]
      - id: rule-a-high-battery
        label: "Arc Lithium Battery Pack"
        priority: high
        includeKeywords: ["ego", "battery"]
        excludeKeywords: ["lego", "makita", "dewalt", "ryobi", "milwaukee", "bosch"]
      - id: rule-a-high-bare
        label: "Power Equipment Bare Tool"
        priority: high
        includeKeywords: ["ego", "power"]
        excludeKeywords: ["lego"]
      - id: rule-a-normal-mower
        label: "Cordless Mower"
        priority: normal
        includeKeywords: ["ego", "mower"]
        excludeKeywords: ["lego"]

  - id: src-a-tough-cameras
    site: cashconverters
    label: "Source A - Tough Cameras (TG-6 / TG-7)"
    path: "/Search?SearchQuery=TG-"
    enabled: true
    rules:
      - id: rule-a-critical-tg7
        label: "OM System Tough TG-7"
        priority: critical
        includeKeywords: ["tg-7"]
        excludeKeywords: ["case only", "housing only", "battery only"]
      - id: rule-a-critical-tg6
        label: "Olympus Tough TG-6"
        priority: critical
        includeKeywords: ["tg-6"]
        excludeKeywords: ["case only", "housing only", "battery only"]
      - id: rule-a-high-tough-om
        label: "OM System Tough Camera"
        priority: high
        includeKeywords: ["om system", "tough"]
        excludeKeywords: ["case only", "housing only"]
      - id: rule-a-high-tough-olympus
        label: "Olympus Tough Camera"
        priority: high
        includeKeywords: ["olympus", "tough"]
        excludeKeywords: ["case only", "housing only", "tg-1", "tg-2", "tg-3", "tg-4", "tg-5"]

