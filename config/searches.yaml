        excludeKeywords: ["phone", "smartphone"]
      - id: rule-cc-critical-3d
        label: "LG 3D TV / OLED"
        priority: critical
        includeKeywords: ["lg", "3d"]
        excludeKeywords: ["glasses only", "phone", "monitor"]
      - id: rule-cc-high-ef950
        label: "LG 65EF950 3D OLED"
        priority: high
        includeKeywords: ["lg", "ef950"]
      - id: rule-cc-high-oled
        label: "LG 65\" OLED Panel"
        priority: high
        includeKeywords: ["lg", "oled", "65"]
      - id: rule-cc-normal-65
        label: "LG 65\" TV Generic"
        priority: normal
        includeKeywords: ["lg", "65"]
        excludeKeywords: ["remote only", "stand only", "bracket"]

