searches:
  # =============================================================
  # CASH CONVERTERS NZ (shop.cashconverters.co.nz)
  # =============================================================
  - id: cc-lg-65
    site: cashconverters
    label: "Cash Converters - LG 65\" / OLEDs"
    path: "/Search?SearchQuery=LG+65"
    enabled: true
    rules:
      - id: rule-cc-critical-g6
        label: "LG 65G6 3D OLED"
        priority: critical
        includeKeywords: ["lg", "g6"]
        excludeKeywords: ["phone", "smartphone", "thinq"]
      - id: rule-cc-critical-e6
        label: "LG 65E6 3D OLED"
        priority: critical
        includeKeywords: ["lg", "e6"]
        excludeKeywords: ["phone", "smartphone"]
      - id: rule-cc-critical-c6
