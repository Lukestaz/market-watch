name: Daily market watch

on:
  schedule:
    # 23:15 UTC is 11:15 AM NZST (mid-morning additions)
    # 06:15 UTC is 06:15 PM NZST (afternoon/close-of-day additions)
    - cron: "15 23,6 * * *"
  workflow_dispatch:
    inputs:
      search_scope:
        description: "Search scope to run"
        required: true
        type: choice
        default: "all"
        options:
          - "all"
          - "cc-lg-65-broad"
          - "cc-lg-77-broad"
          - "cc-lg-oled-broad"
          - "cc-lg-g6"
          - "cc-lg-e6"
          - "cc-lg-c6"
          - "cc-lg-3d"
          - "cc-lg-ef950"
          - "cc-ego-56v"
          - "cc-ego-power"

permissions:
  contents: write

concurrency:
  group: market-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install packages
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run watcher
        run: |
          if [ "${{ inputs.search_scope }}" != "all" ] && [ -n "${{ inputs.search_scope }}" ]; then
            npm run watch -- --search "${{ inputs.search_scope }}"
          else
            npm run watch
          fi

      - name: Commit successful state update
        run: |
          git config user.name "market-watch[bot]"
          git config user.email "market-watch[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "Update market watch state"
          git push

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watcher-diagnostics
          path: debug/
          if-no-files-found: ignore
          retention-days: 14
