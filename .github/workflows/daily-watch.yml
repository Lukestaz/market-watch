name: Daily market watch
run-name: >-
  ${{
    github.event_name == 'workflow_dispatch'
      && format('Market Watch [Manual: {0}] by @{1}', inputs.search_scope, github.actor)
      || github.event_name == 'schedule'
      && 'Market Watch [Scheduled NZST]'
      || format('Market Watch [Push]: {0}', github.event.head_commit.message)
  }}

on:
  schedule:
    # 23:15 UTC is 11:15 AM NZST (mid-morning additions)
    # 06:15 UTC is 06:15 PM NZST (afternoon/close-of-day additions)
    - cron: "15 23,6 * * *"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "config/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/daily-watch.yml"
  workflow_dispatch:
    inputs:
      search_scope:
        description: "Search scope to run"
        required: true
        type: choice
        default: "all"
        options:
          - "all"
          - "cc-lg-65-broad"
          - "cc-lg-77-broad"
          - "cc-lg-oled-broad"
          - "cc-lg-g6"
          - "cc-lg-e6"
          - "cc-lg-c6"
          - "cc-lg-3d"
          - "cc-lg-ef950"
          - "cc-ego-56v"
          - "cc-ego-power"
          - "dd-lg-65"
          - "dd-lg-oled"
          - "dd-ego-56v"
          - "dd-ego-power"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: market-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install packages
        run: npm install

      - name: Typecheck
        run: |
          mkdir -p data debug public
          npm test 2>&1 | tee data/latest-run.log

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run watcher
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
        run: |
          if [ "${{ inputs.search_scope }}" != "all" ] && [ -n "${{ inputs.search_scope }}" ]; then
            npm run watch -- --search "${{ inputs.search_scope }}" 2>&1 | tee -a data/latest-run.log
          else
            npm run watch 2>&1 | tee -a data/latest-run.log
          fi

      - name: Commit run log and state update
        if: always()
        run: |
          git config user.name "market-watch[bot]"
          git config user.email "market-watch[bot]@users.noreply.github.com"
          git add data/state.json data/latest-run.log
          git diff --cached --quiet || git commit -m "Update state and run log [skip ci]"
          git push || echo "Git push skipped"

      - name: Deploy Dashboard to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

      - name: Report failure to GitHub Issues
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="[Automated Alert] Watcher Run Failed ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          BODY=$(printf "### Watcher Execution Failure\n\nRun failed with the following log excerpt:\n\n\`\`\`\n%s\n\`\`\`\n\nWorkflow: %s/actions/runs/%s" "$(tail -n 80 data/latest-run.log 2>/dev/null || echo 'No log available')" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh issue create --title "$TITLE" --body "$BODY" --label "bug" || echo "Issue creation skipped"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watcher-diagnostics
          path: debug/
          if-no-files-found: ignore
          retention-days: 14
