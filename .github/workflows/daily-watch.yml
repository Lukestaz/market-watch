name: Market Watcher Automated Scrape & Alert

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'config/**'
      - '.github/workflows/daily-watch.yml'
      - 'package.json'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: market-watch-scrape
  cancel-in-progress: false

jobs:
  scrape-and-alert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Create fallback dashboard
        run: |
          mkdir -p dist data
          cat > dist/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Market Watch</title>
            <style>
              body { margin: 0; padding: 32px; background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
              main { max-width: 720px; margin: 10vh auto; background: #1e293b; padding: 28px; border: 1px solid #334155; border-radius: 12px; }
              h1 { margin-top: 0; } p { color: #cbd5e1; line-height: 1.55; } .muted { color: #94a3b8; font-size: .9rem; }
            </style>
          </head>
          <body>
            <main>
              <h1>Market Watch</h1>
              <p>The dashboard is being refreshed. Please check back shortly.</p>
              <p class="muted">A source or processing task may have failed during the latest run; the automated watcher will retry on its next scheduled run.</p>
            </main>
          </body>
          </html>
          EOF
          echo '{"status":"refreshing"}' > dist/feed.json

      - name: Run Market Watcher Pipeline
        id: pipeline
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          npm run watch 2>&1 | tee /tmp/market-watch-run.log
          exit_code=${PIPESTATUS[0]}
          finished_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          status="success"
          if [ "$exit_code" -ne 0 ]; then
            status="failed"
          fi

          mkdir -p data dist
          tail -n 100 /tmp/market-watch-run.log \
            | sed -E \
              -e 's/(AIza[[:alnum:]_-]{20,})/[REDACTED_GEMINI_KEY]/g' \
              -e 's/(ghp_[[:alnum:]_]+|github_pat_[[:alnum:]_]+)/[REDACTED_GITHUB_TOKEN]/g' \
              -e 's/([Pp]assword|[Tt]oken|[Kk]ey)[=:][^[:space:]]+/\1=[REDACTED]/g' \
            > data/latest-run-summary.txt

          node -e '
            const fs = require("fs");
            const [status, exitCode, startedAt, finishedAt] = process.argv.slice(1);
            fs.writeFileSync("data/run-status.json", JSON.stringify({
              status,
              exitCode: Number(exitCode),
              startedAt,
              finishedAt,
              command: "npm run watch"
            }, null, 2) + "\n");
          ' "$status" "$exit_code" "$started_at" "$finished_at"
          cp data/run-status.json dist/status.json

          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Ensure dashboard output exists
        if: always()
        run: |
          test -f dist/index.html
          test -s dist/index.html
          echo "Dashboard output is present."

      - name: Deploy Dashboard to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

      - name: Commit run state and diagnostics
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/run-status.json data/latest-run-summary.txt
          git add -f data/state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No state or diagnostic changes to commit."
            exit 0
          fi

          git commit -m "Update watcher status [skip ci]"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Could not rebase diagnostic commit onto origin/main."
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Diagnostics pushed."
              exit 0
            fi

            echo "Push conflict on attempt ${attempt}; retrying."
            sleep $((attempt * 2))
          done

          echo "Unable to push diagnostics after retries."
          exit 1
