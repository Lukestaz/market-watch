<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market Watch — Watch / Hide</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#f8fafc;font:16px/1.5 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:24px}h1{margin:0}p{color:#cbd5e1}header,.controls,.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.controls{margin:20px 0}input,select,button,.link{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid #475569;background:#1e293b;color:#f8fafc}input{flex:1;min-width:180px}button,.link{cursor:pointer}button:disabled{opacity:.45;cursor:wait}a{color:#93c5fd}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px}.card{padding:18px;border:1px solid #334155;border-radius:12px;background:#1e293b;display:flex;flex-direction:column;gap:10px}.card h2{font-size:18px;margin:0}.card p{margin:0}.card[data-decision=watch]{border-color:#fbbf24}.card[data-decision=hide]{border-style:dashed}.actions{margin-top:auto}.price{color:#4ade80;font-weight:700}.muted{font-size:13px;color:#94a3b8}#status{padding:10px 0;min-height:44px}#status[data-error=true]{color:#fca5a5}.active-choice{background:#854d0e}.empty{grid-column:1/-1;padding:30px;text-align:center}footer{margin-top:25px;color:#94a3b8;font-size:13px}
</style>
</head>
<body><main>
<header><h1>Market Watch</h1><button id="refresh">Refresh</button><button id="undo" disabled>Undo last change</button></header>
<p>Private Watch/Hide view. Decisions sync through D1. Hide does not suppress email alerts yet.</p>
<div id="status" role="status" aria-live="polite">Loading…</div>
<div class="controls">
<input id="search" type="search" placeholder="Search title, model, branch…" aria-label="Search listings">
<select id="view" aria-label="Decision filter"><option value="all">All (except hidden)</option><option value="watch">Watching</option><option value="hide">Hidden</option></select>
<select id="priority" aria-label="Priority filter"><option value="all">All priorities</option><option value="critical">Critical</option><option value="high">High</option><option value="normal">Normal</option></select>
<select id="store" aria-label="Store filter"><option value="all">Both stores</option><option value="cashconverters">Cash Converters</option><option value="dollardealers">Dollar Dealers</option></select>
</div>
<p id="summary" class="muted"></p><section id="items" class="grid" aria-label="Listings"></section>
<footer>Listings come from the existing scheduled scraper. <a href="https://lukestaz.github.io/market-watch/" target="_blank" rel="noopener noreferrer">Original dashboard</a>. Refresh or reopen this page to load changes from another device.</footer>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
let listings = [], decisions = new Map(), updatedAt = '', loaded = false, busy = false, lastChange = null;
function status(message, error = false) { $('status').textContent = message; $('status').dataset.error = String(error); }
function canonical(value) {
  try {
    const url = new URL(value);
    if (url.protocol !== 'https:' || url.username || url.password || url.port || !['shop.cashconverters.co.nz','dollardealers.co.nz'].includes(url.hostname)) return null;
    url.search = ''; url.hash = ''; return url.toString().replace(/\/$/, '');
  } catch { return null; }
}
function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}
function record(id) { return decisions.get(id) || { identity: id, decision: 'normal', version: 0 }; }
function validRow(row) { return row && canonical(row.identity) === row.identity && ['normal','watch','hide'].includes(row.decision) && Number.isSafeInteger(row.version) && row.version > 0; }
async function jsonRequest(path, options = {}) {
  const response = await fetch(path, { credentials: 'same-origin', cache: 'no-store', signal: AbortSignal.timeout(15000), ...options });
  if (response.status === 409) { const error = new Error('Changed on another device. Refresh before trying again.'); error.conflict = true; throw error; }
  if (!response.ok) throw new Error('Request failed (' + response.status + '). Reload to sign in again if needed.');
  if (!(response.headers.get('Content-Type') || '').includes('application/json')) throw new Error('Login required. Reload this page to sign in.');
  return response.json();
}
function render() {
  $('refresh').disabled = busy;
  $('undo').disabled = busy || !loaded || !lastChange;
  const query = $('search').value.toLowerCase().trim(), view = $('view').value;
  const visible = listings.filter(listing => {
    const id = canonical(listing.canonicalUrl || listing.url); if (!id) return false;
    const decision = record(id).decision;
    return (view === 'all' ? decision !== 'hide' : decision === view)
      && ($('priority').value === 'all' || listing.priority === $('priority').value)
      && ($('store').value === 'all' || listing.siteId === $('store').value)
      && (!query || [listing.title, listing.modelNumber, listing.seller, listing.condition].join(' ').toLowerCase().includes(query));
  });
  const fragment = document.createDocumentFragment();
  for (const listing of visible) {
    const id = canonical(listing.canonicalUrl || listing.url), row = record(id);
    const card = element('article', undefined, 'card'); card.dataset.decision = row.decision;
    card.append(element('div', [listing.siteId === 'cashconverters' ? 'Cash Converters' : 'Dollar Dealers', listing.priority, row.decision].join(' · '), 'muted'));
    const heading = element('h2'), link = element('a', listing.title || 'Listing'); link.href = id; link.target = '_blank'; link.rel = 'noopener noreferrer'; heading.append(link); card.append(heading);
    card.append(element('div', typeof listing.price === 'number' && Number.isFinite(listing.price) ? new Intl.NumberFormat('en-NZ', { style: 'currency', currency: 'NZD' }).format(listing.price) : listing.priceText || 'Price on request', 'price'));
    if (listing.modelNumber || listing.seller) card.append(element('p', [listing.modelNumber, listing.seller].filter(Boolean).join(' · '), 'muted'));
    if (listing.condition) card.append(element('p', listing.condition, 'muted'));
    if (listing.ai) card.append(element('p', 'AI ' + listing.ai.score + '/10 · ' + listing.ai.verdict + ' — ' + (listing.ai.reason || ''), 'muted'));
    const actions = element('div', undefined, 'actions');
    const watch = element('button', row.decision === 'watch' ? 'Unwatch' : 'Watch'); watch.disabled = busy || !loaded; if (row.decision === 'watch') watch.className = 'active-choice';
    watch.addEventListener('click', () => save(id, row.decision === 'watch' ? 'normal' : 'watch'));
    const hide = element('button', row.decision === 'hide' ? 'Unhide' : 'Hide'); hide.disabled = busy || !loaded; hide.addEventListener('click', () => save(id, row.decision === 'hide' ? 'normal' : 'hide'));
    actions.append(watch, hide); card.append(actions); fragment.append(card);
  }
  if (!visible.length) fragment.append(element('p', 'No listings match this view.', 'empty'));
  $('items').replaceChildren(fragment);
  $('summary').textContent = visible.length + ' shown · ' + listings.length + ' active listings · Feed updated: ' + (updatedAt ? new Date(updatedAt).toLocaleString() : 'unknown');
}
async function load() {
  if (busy) return; busy = true; loaded = false; render(); status('Loading listings and shared decisions…');
  try {
    const [feed, state] = await Promise.all([jsonRequest('/api/feed'), jsonRequest('/api/decisions')]);
    if (!Array.isArray(feed.listings) || !Array.isArray(state.decisions) || !state.decisions.every(validRow)) throw new Error('Invalid API response.');
    listings = feed.listings.filter(listing => listing && listing.status === 'active' && listing.priority !== 'ignore');
    decisions = new Map(state.decisions.map(row => [row.identity, row])); updatedAt = feed.updatedAt || ''; loaded = true;
    if (lastChange && record(lastChange.identity).version !== lastChange.version) lastChange = null;
    status('Synced. Watch/Hide changes are saved across devices.');
  } catch (error) { status(error.message + ' Changes are disabled until Refresh succeeds.', true); }
  finally { busy = false; render(); }
}
async function save(id, decision, undo = false) {
  if (busy || !loaded) return;
  const previous = record(id);
  if (undo && (!lastChange || previous.version !== lastChange.version)) { status('Undo is stale. Refresh first.', true); return; }
  busy = true; render(); status('Saving…');
  try {
    const row = await jsonRequest('/api/decisions', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ identity: id, decision, version: previous.version }) });
    if (!validRow(row) || row.identity !== id || row.decision !== decision || row.version !== previous.version + 1) throw new Error('Could not confirm the saved decision.');
    decisions.set(id, row); lastChange = undo ? null : { identity: id, decision: previous.decision, version: row.version };
    status('Saved: ' + decision + '. Hide affects this dashboard only; email suppression is not connected yet.');
  } catch (error) { loaded = false; status(error.message + ' Save outcome may be unknown; Refresh before changing anything else.', true); }
  finally { busy = false; render(); }
}
$('refresh').addEventListener('click', load);
$('undo').addEventListener('click', () => { if (lastChange) save(lastChange.identity, lastChange.decision, true); });
for (const id of ['search','view','priority','store']) $(id).addEventListener(id === 'search' ? 'input' : 'change', render);
load();
</script></body></html>
